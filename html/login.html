    <h4>SIGN IN</h4>
    <form >
        <div class="mb-3 mx-auto">
         <label for="exampleInputEmail1" class="form-label" >Email address</label>
         <input type="email" class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp" >
         <div id="emailHelp" class="form-text text-light">We'll never share your email with anyone else.</div>
        </div>
        <div class="mb-3 mx-auto">
         <label for="exampleInputPassword1" class="form-label">Password</label>
         <input type="password" class="form-control" id="exampleInputPassword1">
         <small id="strength"></small>
        </div>
        <div class="mb-3 mx-auto form-check">
         <input type="checkbox" class="form-check-input" id="exampleCheck1">
         <label class="form-check-label" for="exampleCheck1">Stay signed in</label>
        </div>
       
        <div class="mb-3 mx-auto " >
        <button type="submit" class="btn btn-light opacity-75 w-100 " onclick="signIn()">SIGN IN</button>
        
        </div>
        <div class="mb-3 mx-auto">
        <button type="submit" class="btn btn-outline-light w-100">CREATE ACCOUNT</button>
        </div>
         <a href="" class="form-text text-light">Forgotten your password?</a>
        


    </form>
